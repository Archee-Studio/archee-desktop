name: release

# Builds the Archee Studio installers for a vX.Y.Z tag and publishes them as this repository's
# release, then updates the Homebrew cask in Archee-Studio/homebrew-tap. The tag is pushed by
# shipbot, the Archee Shipbot GitHub App, together with the source it builds.
# Actions are pinned to full commit SHAs (tags can be moved).
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      cask_only:
        description: "Only rewrite the Homebrew cask from the release of this tag (after a failed cask job)"
        required: false
        default: false
        type: boolean

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  RELEASES_REPO: ${{ github.repository }}

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: package.json
          sparse-checkout-cone-mode: false
      - id: v
        env:
          TAG: ${{ github.ref_name }}
        run: |
          if ! [[ "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            echo "::error::Run this from a vX.Y.Z tag, not '$TAG'."
            exit 1
          fi
          version="${BASH_REMATCH[1]}"
          have=$(jq -r .version package.json)
          if [ "$have" != "$version" ]; then
            echo "::error::package.json says $have at $TAG, not $version."
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

  mac:
    needs: preflight
    if: ${{ !inputs.cask_only }}
    # macos-15 is Apple silicon; the Intel dmg is cross-compiled on it, so it costs one more job and no Intel runner.
    runs-on: macos-15
    timeout-minutes: 60
    strategy:
      fail-fast: true
      matrix:
        include:
          - arch: arm64
            triple: aarch64-apple-darwin
          - arch: x64
            triple: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10
        with:
          toolchain: stable
          targets: ${{ matrix.triple }}
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
          key: ${{ matrix.triple }}
      - name: Build the dmg
        run: |
          bun install --frozen-lockfile
          bun run build -- --target "${{ matrix.triple }}" --bundles dmg
      - name: Check the signature
        # The bundle is ad-hoc signed ("signingIdentity": "-" in tauri.conf.json). A bundle whose binary
        # alone is signed is reported by macOS as damaged, with no way to open it, so it never ships.
        run: |
          codesign --verify --deep --strict --verbose=2 src-tauri/target/${{ matrix.triple }}/release/bundle/macos/*.app
      - name: Name and checksum
        run: |
          mkdir out
          cp src-tauri/target/${{ matrix.triple }}/release/bundle/dmg/*.dmg "out/Archee-Studio-mac-${{ matrix.arch }}.dmg"
          cd out
          shasum -a 256 "Archee-Studio-mac-${{ matrix.arch }}.dmg" > "Archee-Studio-mac-${{ matrix.arch }}.dmg.sha256"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-mac-${{ matrix.arch }}
          path: out/*
          if-no-files-found: error

  windows:
    needs: preflight
    if: ${{ !inputs.cask_only }}
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # master, 2026-10
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3
        with:
          workspaces: src-tauri
      - name: Build the msi
        run: |
          bun install --frozen-lockfile
          bun run build -- --bundles msi
      - name: Name and checksum
        run: |
          mkdir out
          cp src-tauri/target/release/bundle/msi/*.msi out/Archee-Studio-windows-x64.msi
          cd out
          sha256sum Archee-Studio-windows-x64.msi > Archee-Studio-windows-x64.msi.sha256
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: desktop-windows-x64
          path: out/*
          if-no-files-found: error

  release:
    needs: [preflight, mac, windows]
    if: ${{ !inputs.cask_only }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: desktop-*
          path: out
          merge-multiple: true
      - name: Create the release (never overwrites)
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
        run: |
          if gh release view "v$VERSION" -R "$RELEASES_REPO" >/dev/null 2>&1; then
            echo "::error::Release v$VERSION already exists. It is never overwritten; publish a new version instead."
            exit 1
          fi
          ls -l out
          gh release create "v$VERSION" out/* -R "$RELEASES_REPO" --verify-tag \
            --title "Archee Studio $VERSION" \
            --notes "Archee Studio for the desktop, version $VERSION. Download and install: https://archee.studio/download/" \
            --latest

  cask:
    needs: [preflight, release]
    # Runs after a skipped release too, so cask_only can repair the cask on its own.
    if: ${{ !cancelled() && (needs.release.result == 'success' || needs.release.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - id: token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ secrets.SHIPBOT_APP_ID }}
          private-key: ${{ secrets.SHIPBOT_PRIVATE_KEY }}
          owner: Archee-Studio
          repositories: homebrew-tap
      - name: Write Casks/archee-desktop.rb
        env:
          GH_TOKEN: ${{ steps.token.outputs.token }}
          VERSION: ${{ needs.preflight.outputs.version }}
          TAP: Archee-Studio/homebrew-tap
          CASK_PATH: Casks/archee-desktop.rb
        run: |
          set -euo pipefail
          dl="https://github.com/$RELEASES_REPO/releases/download/v$VERSION"
          arm=$(curl -fsSL "$dl/Archee-Studio-mac-arm64.dmg.sha256" | cut -d' ' -f1)
          x64=$(curl -fsSL "$dl/Archee-Studio-mac-x64.dmg.sha256" | cut -d' ' -f1)
          for h in "$arm" "$x64"; do
            [[ "$h" =~ ^[0-9a-f]{64}$ ]] || { echo "::error::Release v$VERSION has no valid .sha256 files."; exit 1; }
          done
          cat > cask.rb <<RUBY
          cask "archee-desktop" do
            arch arm: "arm64", intel: "x64"

            version "$VERSION"
            sha256 arm:   "$arm",
                   intel: "$x64"

            url "https://github.com/$RELEASES_REPO/releases/download/v#{version}/Archee-Studio-mac-#{arch}.dmg"
            name "Archee Studio"
            desc "Desktop app for Archee Studio"
            homepage "https://archee.studio/"

            depends_on macos: ">= :ventura"

            app "Archee Studio.app"
          end
          RUBY
          content=$(base64 -w0 cask.rb)

          # The tap may still be empty: without main, the first PUT creates it.
          args=(-f "message=archee-desktop $VERSION" -f "content=$content")
          if gh api "repos/$TAP/branches/main" >/dev/null 2>&1; then
            args+=(-f branch=main)
            if existing=$(gh api "repos/$TAP/contents/$CASK_PATH?ref=main" 2>/dev/null); then
              if [ "$(jq -r .content <<<"$existing" | tr -d '\n' | base64 -d)" = "$(cat cask.rb)" ]; then
                echo "Cask already up to date; nothing to do."
                exit 0
              fi
              args+=(-f "sha=$(jq -r .sha <<<"$existing")")
            fi
          fi
          gh api -X PUT "repos/$TAP/contents/$CASK_PATH" "${args[@]}" --jq .commit.html_url
