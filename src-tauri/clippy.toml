# Clippy settings for the lint table in Cargo.toml. The core and desktop workspaces keep identical copies.
# A panic is the assertion in a test, so tests may unwrap, expect, index and print.
allow-unwrap-in-tests = true
allow-expect-in-tests = true
allow-panic-in-tests = true
allow-indexing-slicing-in-tests = true
allow-print-in-tests = true
# A bool parameter is unreadable at the call site; use an enum or two methods.
max-fn-params-bools = 0
